<!-- Segment consent gate begin -->
<!--
  Holds analytics.load() until Ketch reports consent, then stamps every event
  with context.consent.categoryPreferences, which Segment Consent Management
  uses to decide which destinations receive it. The Ketch purpose codes
  (analytics, essential_services, marketing) are the Segment consent category
  names verbatim, so Ketch's purposes pass straight through.

  Must run after both the Ketch tag and the Segment snippet, and before
  analytics.load() is called. Keep every copy identical: sftptogo web-client
  (public/index.html, public/free-trial/index.html), sftptogo-docs,
  terraform auth0/templates/universal_login.html, and the crontogo and
  activitytogo web clients (public/index.html).
-->
<script type="text/javascript">
  !function () {
    var analytics = window.analytics;
    if (!analytics || analytics.initialize || analytics.consentGated) return;
    analytics.consentGated = true;

    var segmentLoad = analytics.load;
    var purposes = null; // latest Ketch purposes, e.g. { analytics: true, marketing: false }
    var loadArgs = null; // the first analytics.load() call, held until consent is known
    var loaded = false;
    var segmentCategories = []; // the source's consent categories, from its CDN settings

    // Ketch leaves ungranted purposes out rather than setting them to false, so every
    // Segment category is listed explicitly and defaults to not consented.
    function categoryPreferences() {
      var preferences = {};
      segmentCategories.forEach(function (category) { preferences[category] = false; });
      for (var code in purposes) preferences[code] = purposes[code] === true;
      return preferences;
    }

    function samePurposes(a, b) {
      return Object.keys(a).concat(Object.keys(b)).every(function (code) { return !a[code] === !b[code]; });
    }

    // Device-mode destinations (GA4, Google Ads, GTM, Intercom) run in the browser,
    // out of reach of Segment's server-side consent filtering, so the ones the visitor
    // hasn't consented to are never loaded. Consent granted later takes effect on the
    // next page load. A destination with no consent category stays on.
    function dropUnconsentedDestinations(settings) {
      var preferences = categoryPreferences(), integrations = {}, dropped = {};
      Object.keys(settings.integrations || {}).forEach(function (name) {
        var integration = settings.integrations[name];
        var categories = (integration && integration.consentSettings && integration.consentSettings.categories) || [];
        var consented = categories.every(function (category) { return preferences[category]; });
        if (consented) integrations[name] = integration; else dropped[name] = true;
      });
      return Object.assign({}, settings, {
        integrations: integrations,
        remotePlugins: (settings.remotePlugins || []).filter(function (plugin) { return !dropped[plugin.creationName]; })
      });
    }

    function loadIfConsented() {
      if (loaded || !loadArgs || !purposes) return;
      var preferences = categoryPreferences();
      // Nothing consented at all: send nothing.
      if (!Object.keys(preferences).some(function (code) { return preferences[code]; })) return;
      loaded = true;

      analytics.addSourceMiddleware(function (ctx) {
        var context = ctx.payload.obj.context = ctx.payload.obj.context || {};
        context.consent = Object.assign({}, context.consent, { categoryPreferences: categoryPreferences() });
        ctx.next(ctx.payload);
      });

      var options = Object.assign({}, loadArgs[1]);
      var updateCDNSettings = options.updateCDNSettings;
      options.updateCDNSettings = function (settings) {
        segmentCategories = (settings.consentSettings && settings.consentSettings.allCategories) || [];
        return dropUnconsentedDestinations(updateCDNSettings ? updateCDNSettings(settings) : settings);
      };
      segmentLoad.call(analytics, loadArgs[0], options);
    }

    // Later calls (single-page-app re-renders call load on every page) are no-ops.
    analytics.load = function (writeKey, options) {
      if (!loadArgs) loadArgs = [writeKey, options];
      loadIfConsented();
    };

    // Ketch fires this once consent is resolved on page load, and again on every change.
    window.ketch('on', 'consent', function (consent) {
      var next = consent.purposes || {};
      var changed = purposes !== null && !samePurposes(purposes, next);
      purposes = Object.assign({}, next);
      if (changed && loaded) window.analytics.track('Segment Consent Preference Updated');
      loadIfConsented();
    });
  }();
</script>
<!-- Segment consent gate end -->
