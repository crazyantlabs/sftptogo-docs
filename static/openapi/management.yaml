    post:
      operationId: CreateCredential
      summary: Create a credential
      tags:
        - Credentials
      description: |
        Creates a login for SFTP, FTPS, the web portal and the S3-compatible endpoint.

        Everything is optional. With an empty body you get a generated name, a generated password that
        satisfies your organization's password policy, a home directory of `/home/{UserName}`, and
        `Permission: none`: connectable, but able to see nothing. In practice you almost always want to
        set `Permission`, or give the credential virtual folders with `HomeDirectoryDetails`.

        The response includes the password. You can read it again later with the get or list
        endpoints, since we store it, but capture it now if you are handing it to someone.

        Counts against your plan's credential limit.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
            examples:
              minimal:
                summary: Let us choose everything
                value: {}
              typical:
                summary: A named credential for a specific system
                value:
                  UserName: data-warehouse-prod
                  Alias: Data warehouse (production)
                  Permission: read-write
                  HomeDirectory: /exports/warehouse
                  Email: data-team@example.com
              virtualFolders:
                summary: A partner who drops files in one folder and collects from another
                value:
                  UserName: partner-acme
                  HomeDirectoryDetails:
                    - Entry: /inbound
                      Target: /partners/acme/inbound
                      Permission: write-only
                    - Entry: /outbound
                      Target: /partners/acme/outbound
                      Permission: read-only
              expiring:
                summary: A drop box that stops working on a date
                value:
                  UserName: contractor-q3
                  Permission: write-only
                  HomeDirectory: /contractors/q3
                  ChrootDirectory: /contractors/q3
                  ExpiresAt: 1793318400
      responses:
        '201':
          description: The credential was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                default:
                  summary: A newly created credential
                  value:
                    Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                    OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
                    UserName: data-warehouse-prod
                    Alias: Data warehouse (production)
                    State: active
                    Permission: read-write
                    Host: example.sftptogo.com
                    HomeDirectory: /exports/warehouse
                    ChrootDirectory: /
                    SupportedProtocols:
                      - SFTP
                      - FTPS
                      - WEB_PORTAL
                    Email: data-team@example.com
                    EmailVerified: false
                    IsDefault: false
                    SshPublicKeysCount: 0
                    Settings:
                      Security:
                        MFA:
                          Required: false
                          Factors: []
                      Network:
                        InboundRules: []
                    Password: x7k2m9q4w8n3p6r1t5v0y2b4d6f8h1
                    URI: sftp://data-warehouse-prod:x7k2m9q4w8n3p6r1t5v0y2b4d6f8h1@example.sftptogo.com
                    CreatedAt: 1780675200000
                    UpdatedAt: 1780675200000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Either creating this credential would exceed the number your plan allows (delete one you no
            longer need, or upgrade), or your organization is still being set up and cannot take new
            credentials yet (retry in a few minutes). The `message` says which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                limit:
                  summary: The plan's credential limit is reached
                  value:
                    id: forbidden
                    message: You have reached the maximum number of users (25).
                notReady:
                  summary: The organization is still being set up
                  value:
                    id: forbidden
                    message: Organization is not in active state. Please try again in a few minutes.
        '422':
          description: |
            The login name is taken. Names are unique across the whole service, so this can happen with
            a name you have never used. Pick another and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: unprocessable_entity
                    message: Unfortunately, the username is not available. Please choose another one.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organizations/{organizationId}/users/check-name:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: CheckCredentialName
      summary: Check a login name
      tags:
        - Credentials
      description: |
        Reports whether a login name is already taken.

        Names are unique across the whole service rather than within your organization, so a name can be
        unavailable even though you have never used it. Call this before creating or renaming a
        credential to avoid either.

        A small set of reserved names — `admin`, `root`, `support` and similar — always report as
        taken. Note that the two cases fail differently when you go on to use the name: one already in
        use returns `422`, whereas a reserved one is rejected by validation with `400`.

        It is a `POST` because the name travels in the body rather than the URL, which keeps it out of
        logs and browser history. Nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The name to check.
              required:
                - UserName
              properties:
                UserName:
                  type: string
                  description: The login name to test. Compared exactly as sent.
            examples:
              default:
                value:
                  UserName: data-warehouse-prod
      responses:
        '200':
          description: Whether the name is taken.
          content:
            application/json:
              schema:
                type: object
                description: The result of the check.
                required:
                  - exists
                properties:
                  exists:
                    type: boolean
                    description: |
                      `true` when the name is unavailable, whether it is already in use or reserved.
                      `false` when you can use it.
              examples:
                available:
                  summary: The name is free
                  value:
                    exists: false
                taken:
                  summary: The name is taken or reserved
                  value:
                    exists: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: No `UserName` was sent, or it was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: invalid_params
                    message: Username is invalid.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /organizations/{organizationId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CredentialId'
    get:
      operationId: GetCredential
      summary: Retrieve a credential
      tags:
        - Credentials
      description: |
        Returns one credential, including its current password in clear text, a ready-made connection
        string and the SSH public keys attached to it. Handle the response as a secret.

        Use `PasswordCreatedAt` to find credentials that are due for rotation.
      responses:
        '200':
          description: The credential, with its SSH public keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                default:
                  summary: A credential that has been in use
                  value:
                    Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                    OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
