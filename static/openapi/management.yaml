    patch:
      operationId: UpdateCredentials
      summary: Update credentials
      tags:
        - Credentials
      description: |
        Updates the properties of credentials.

        Send only the fields you want to change. Fields you omit are left as they are and aren't
        validated. An empty string resets `Alias` to the login name, `HomeDirectory` to
        `/home/{UserName}` and `ChrootDirectory` to `/`.

        On a plan without inbound rules, changes to `Settings.Network.InboundRules` are skipped without
        an error and the rest of the update applies.

        Changes apply to new connections; open sessions aren't interrupted. To change the password,
        rotate it instead.
      x-plan:
        feature: inbound-rules
        appliesTo: Settings.Network.InboundRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialsRequest'
            examples:
              permission:
                summary: Reduce access to read-only
                value:
                  Permission: read-only
              virtualFolders:
                summary: Switch to virtual folders
                value:
                  HomeDirectoryDetails:
                    - Entry: /inbound
                      Target: /partners/acme/inbound
                      Permission: write-only
                    - Entry: /outbound
                      Target: /partners/acme/outbound
                      Permission: read-only
              homeDirectory:
                summary: Go back to a home directory
                value:
                  HomeDirectoryDetails: []
                  Permission: read-write
              expiry:
                summary: Remove the expiry date
                value:
                  ExpiresAt: null
              network:
                summary: Allow connections from one more range
                value:
                  Settings:
                    Network:
                      InboundRules:
                        - Id: 9b2e4d6f-1a3c-4e5b-8d7f-0c2a4e6b8d1f
                          Protocol: SFTP
                          State: enabled
                          Action: allow
                          Source: 203.0.113.0/24
                          Description: Warehouse egress range
      responses:
        '200':
          description: Returns the updated credentials, including the password in clear text and a connection string. Treat the response as a secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
              examples:
                default:
                  $ref: '#/components/examples/Credentials'
        '400':
          $ref: '#/components/responses/CredentialsBadRequest'
        '401':
          $ref: '#/components/responses/CredentialsUnauthorized'
        '403':
          description: The update would give the credentials more than 250 inbound rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: forbidden
                    message: You have reached the maximum number of inbound rules for these credentials (250).
        '404':
          $ref: '#/components/responses/CredentialsNotFound'
        '422':
          description: The new login name is taken. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: unprocessable_entity
                    message: Unfortunately, the user name is not available. Please choose another one.
        '500':
          $ref: '#/components/responses/CredentialsInternalServerError'
    delete:
      operationId: DeleteCredentials
      summary: Delete credentials
      tags:
        - Credentials
      description: |
        Permanently deletes credentials and releases their login name for reuse.

        This can't be undone. Files aren't deleted: they stay in your storage, reachable through other
        credentials with access to them. You can't delete the organization's default credentials. To
        stop access but keep the credentials, deactivate them instead.
      responses:
        '200':
          description: |
            Returns the deleted credentials as they were before deletion, without the password or the connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
              examples:
                default:
                  summary: Deleted credentials
                  value:
                    Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                    OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
                    UserName: data-warehouse-prod
                    State: active
                    Alias: Data warehouse (production)
                    Host: example.sftptogo.com
                    Permission: read-write
                    HomeDirectory: /exports/warehouse
                    ChrootDirectory: /
                    SshPublicKeysCount: 1
                    Email: data-team@example.com
                    EmailVerified: true
                    IsDefault: false
                    Settings:
                      Security:
                        MFA:
                          Required: true
                          Factors:
