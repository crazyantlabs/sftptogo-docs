                    - Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                      OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
                      UserName: data-warehouse-prod
                      State: active
                      Alias: Data warehouse (production)
