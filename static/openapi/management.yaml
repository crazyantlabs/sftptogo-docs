openapi: 3.1.0
info:
  title: SFTP To Go Management API
  version: '2026-07-31'
  summary: Manage credentials, share links, automations, domains and logs in your SFTP To Go organization.
  description: |
    The SFTP To Go Management API lets you script everything you would otherwise do in the
    dashboard: issue and rotate credentials, create share links, build automations that react to
    file activity, attach custom domains, and pull audit logs.

    ## What this API does not do

    **It does not transfer files.** Files move over SFTP, FTPS or the S3-compatible endpoint, using
    the credentials you create here. There is no upload or download operation in this reference —
    that is by design, not an omission.

    ## Base URL and organization scope

    Almost every path is scoped to an organization:

    ```
    https://api.sftptogo.com/organizations/{organizationId}/...
    ```

    Your API key is bound to a single organization, and a request whose `organizationId` does not
    match the key's organization is rejected.

    The API itself runs in one region. The region you chose for your storage is a property of your
    organization, returned on the organization object — it does not change which host you call.

    ## Conventions

    * Request and response bodies are JSON.
    * Timestamps are Unix epoch milliseconds unless a field says otherwise.
    * Successful responses return the object itself, with no wrapper envelope.
    * List endpoints are cursor-paginated. See the Pagination guide.
    * Errors share one shape. See the Errors guide.
  contact:
    name: SFTP To Go Support
    url: https://sftptogo.com/contact
    email: support@sftptogo.com
  termsOfService: https://sftptogo.com/terms-of-service
servers:
  - url: https://api.sftptogo.com
    description: Production
security:
  - apiKey: []
tags:
  - name: Credentials
    description: |
      Credentials are the SFTP, FTPS and S3 logins your users and systems connect with. The API
      calls this resource `users`; the product calls them credentials, and this reference follows
      the product.
  - name: SSH keys
    description: Public keys attached to a credential, for key-based SFTP authentication.
  - name: S3 credentials
    description: S3-compatible access keys attached to a credential.
  - name: Share links
    description: |
      Links that give someone access to a folder through the web portal, without an SFTP client.
      The API calls this resource `portal-links`.
  - name: Automations
    description: |
      Rules that run when something happens to your files — notify a system, forward a file,
      encrypt or decrypt it. Automations replace webhooks; an existing webhook can be converted
      into the equivalent automation, keeping its signing secret so receivers do not notice.
  - name: Automation runs
    description: |
      The execution history of an automation: what triggered it, what each action did, and whether
      it succeeded. Individual runs can be replayed.
  - name: PGP keys
    description: Keys used by automations that encrypt or decrypt files.
  - name: Audit logs
    description: A record of who did what, across both the dashboard and file activity.
  - name: Audit log streaming
    description: Continuous delivery of audit log events to your own SIEM or log platform.
  - name: Malware scans
    description: Results of malware scanning on uploaded files, and the actions you can take on them.
  - name: Custom domains
    description: Your own hostnames for the SFTP service and the web portal.
  - name: Organization
    description: Your organization's settings, plan, usage metrics and members.
  - name: Team members
    description: |
      People with dashboard access to your organization, and their roles. The API calls this
      resource `memberships`.
paths:
  /organizations/{organizationId}/users:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: ListCredentials
      summary: List credentials
      tags:
        - Credentials
      description: |
        Returns the organization's credentials, newest first, one page at a time.

        Pass `limit` and follow the `next` link in the `Link` header for the following page. Without
        `limit`, a page holds up to 2,000 credentials, which today returns most organizations' whole
        list in one response; that default may be lowered.

        **Each credential in the response includes its password in clear text**, along with a
        ready-made connection string. That is deliberate: we store passwords so the dashboard can
        display and rotate them. It does mean this response is as sensitive as a password file, so
        avoid logging it and never pass it to an untrusted client.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: One page of the organization's credentials, newest first.
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-Total-Count-Exact:
              $ref: '#/components/headers/XTotalCountExact'
          content:
            application/json:
              schema:
                type: array
                description: The credentials on this page.
                items:
                  $ref: '#/components/schemas/Credential'
              examples:
                default:
                  summary: Two credentials
                  value:
                    - Id: 7c2e9a4f1b6d3e8a0c5f2b7d9e1a4c
