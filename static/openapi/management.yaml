    post:
      operationId: CreateCredentials
      summary: Create credentials
      tags:
        - Credentials
      description: |
        Creates credentials for SFTP, FTPS, the web portal and the S3-compatible endpoint.

        Every field is optional. An empty body creates credentials with a generated name and password, a
        home directory of `/home/{UserName}` and `Permission: none`: they can connect but can't see any
        files. Set `Permission`, or give them virtual folders with `HomeDirectoryDetails`.

        You can read the password again later by retrieving the credentials.
      x-plan:
        limit: credentials
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialsRequest'
            examples:
              minimal:
                summary: Let us choose everything
                value: {}
              typical:
                summary: Named credentials for a specific system
                value:
                  UserName: data-warehouse-prod
                  Alias: Data warehouse (production)
                  Permission: read-write
                  HomeDirectory: /exports/warehouse
                  Email: data-team@example.com
              virtualFolders:
                summary: A partner who drops files in one folder and collects from another
                value:
                  UserName: partner-acme
                  HomeDirectoryDetails:
                    - Entry: /inbound
                      Target: /partners/acme/inbound
                      Permission: write-only
                    - Entry: /outbound
                      Target: /partners/acme/outbound
                      Permission: read-only
              expiring:
                summary: A drop box that stops working on a date
                value:
                  UserName: contractor-q3
                  Permission: write-only
                  HomeDirectory: /contractors/q3
                  ChrootDirectory: /contractors/q3
                  ExpiresAt: 1793318400
      responses:
        '201':
          description: Returns the new credentials, including their password in clear text and a connection string. Treat the response as a secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
              examples:
                default:
                  summary: Newly created credentials
                  value:
                    Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                    OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
                    UserName: data-warehouse-prod
                    Alias: Data warehouse (production)
                    State: active
                    Permission: read-write
                    Host: example.sftptogo.com
                    HomeDirectory: /exports/warehouse
                    ChrootDirectory: /
                    SupportedProtocols:
                      - SFTP
                      - FTPS
                      - WEB_PORTAL
                    Email: data-team@example.com
                    EmailVerified: false
                    IsDefault: false
                    SshPublicKeysCount: 0
                    Settings:
                      Security:
                        MFA:
                          Required: false
                          Factors: []
                      Network:
                        InboundRules: []
                    Password: example-password-not-real-000001
                    URI: sftp://data-warehouse-prod:example-password-not-real-000001@example.sftptogo.com
                    CreatedAt: 1780675200000
                    UpdatedAt: 1780675200000
        '400':
          $ref: '#/components/responses/CredentialsBadRequest'
        '401':
          $ref: '#/components/responses/CredentialsUnauthorized'
        '403':
          description: |
            Your plan's limit on credentials is reached, or your organization is still being set up. The `message` says which. Delete credentials you no longer need or upgrade, or retry in a few minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                limit:
                  summary: The plan's limit on credentials is reached
                  value:
                    id: forbidden
                    message: You have reached the maximum number of credentials (25).
                notReady:
                  summary: The organization is still being set up
                  value:
                    id: forbidden
                    message: Organization is not in active state. Please try again in a few minutes.
        '422':
          description: |
            The login name is taken. Names are unique across SFTP To Go, so a name you've never used can be taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: unprocessable_entity
                    message: Unfortunately, the username is not available. Please choose another one.
        '500':
          $ref: '#/components/responses/CredentialsInternalServerError'
  /organizations/{organizationId}/users/check-name:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      operationId: CheckCredentialsName
      summary: Check a login name
      tags:
        - Credentials
      description: |
        Checks whether a login name is available.

        Login names are unique across SFTP To Go, not just your organization. Reserved names such as
        `admin`, `root` and `support` are always reported as taken. If you use one anyway, a name in use
        returns `422` and a reserved name returns `400`.

        This call creates nothing. It's a `POST` so that the name stays out of URLs and logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The name to check.
              required:
                - UserName
              properties:
                UserName:
                  type: string
                  description: The login name, compared exactly as sent.
            examples:
              default:
                value:
                  UserName: data-warehouse-prod
      responses:
        '200':
          description: Returns whether the name is taken.
          content:
            application/json:
              schema:
                type: object
                description: The result of the check.
                required:
                  - exists
                properties:
                  exists:
                    type: boolean
                    description: '`true` if the name is in use or reserved, `false` if you can use it.'
              examples:
                available:
                  summary: The name is free
                  value:
                    exists: false
                taken:
                  summary: The name is taken or reserved
                  value:
                    exists: true
        '401':
          $ref: '#/components/responses/CredentialsUnauthorized'
        '422':
          description: No `UserName` was sent, or it was empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: invalid_params
                    message: Username is invalid.
        '500':
          $ref: '#/components/responses/CredentialsInternalServerError'
  /organizations/{organizationId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CredentialsId'
    get:
      operationId: GetCredentials
      summary: Retrieve credentials
      tags:
        - Credentials
      description: |
        Retrieves one set of credentials by its `Id`.

        The response includes the current password in clear text, a connection string and the attached
        SSH public keys, so treat it as a secret. `PasswordCreatedAt` shows when the password was set.
      responses:
        '200':
          description: Returns the credentials, with their SSH public keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
              examples:
                default:
                  summary: Credentials that have been in use
                  value:
                    Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                    OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
                    UserName: data-warehouse-prod
                    State: active
                    Alias: Data warehouse (production)
                    Host: example.sftptogo.com
                    Permission: read-write
