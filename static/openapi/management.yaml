                              LastAuthAt: 1785337200000
                              CreatedAt: 1781280000000
                              UpdatedAt: 1785337200000
                      Network:
                        InboundRules:
                          - Id: 9b2e4d6f-1a3c-4e5b-8d7f-0c2a4e6b8d1f
                            Protocol: SFTP
                            State: enabled
                            Action: allow
                            Source: 203.0.113.0/24
                            Description: Warehouse egress range
                    LastLogin:
                      Id: 4c1e9b7a-2f0d-4f6e-9a51-7d3b2c8e1f60
                      Timestamp: 1785340800000
                      IpAddress: 203.0.113.0
                      OriginalIpAddress: 203.0.113.24
                      Geo:
                        city: Springfield
