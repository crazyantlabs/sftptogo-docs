                          Target: /partners/acme/inbound
                          Type: DIRECTORY
                          Permission: write-only
                        - Entry: /outbound
                          Target: /partners/acme/outbound
                          Type: DIRECTORY
                          Permission: read-only
                      SupportedProtocols:
                        - SFTP
                        - FTPS
                        - WEB_PORTAL
                      EmailVerified: false
                      IsDefault: false
                      SshPublicKeysCount: 0
                      Settings:
                        Security:
                          MFA:
                            Required: false
                            Factors: []
                        Network:
                          InboundRules: []
                      LastLogin: null
                      LoginsCount: 0
                      Password: example-password-not-real-000002
