openapi: 3.1.0
info:
  title: SFTP To Go Management API
  version: '2026-07-31'
  summary: Manage your SFTP To Go organization's configuration, starting with credentials.
  description: |-
    The SFTP To Go Management API lets you script what you would otherwise do in the dashboard. This reference documents credentials: creating, updating, rotating and removing the logins your users and systems connect with. More of the dashboard is added here as it is documented.

    ## What this API doesn't do

    **It doesn't transfer files.** Files move over SFTP, FTPS or the S3-compatible endpoint, using the credentials you create here. There is no upload or download operation in this reference: that is by design, not an omission.

    ## Base URL and organization scope

    Every path is scoped to an organization: `https://api.sftptogo.com/organizations/{organizationId}/...`

    An API key works for one organization only. See [Authentication](https://sftptogo.com/docs/api/authentication) for how keys work.

    The API itself runs in one region. The region you chose for your storage is a property of your organization and doesn't change which host you call.

    ## Conventions

    * Request and response bodies are JSON. Successful responses return the object itself, with no wrapper envelope.
    * Timestamps are Unix epoch milliseconds unless a field says otherwise.
    * List endpoints return one page at a time. Pass `limit`, and follow the `next` link in the `Link` response header for the following page. `X-Total-Count` gives the total, and `X-Total-Count-Exact` says whether it is exact or a lower bound.
    * Every error has the same shape: a stable `id` to match on, a `message` for people, and, on a `400`, an `errors` object or list naming the fields that were rejected.
  contact:
    name: SFTP To Go Support
    url: https://sftptogo.com/contact
    email: support@sftptogo.com
  termsOfService: https://sftptogo.com/terms-of-service
servers:
  - url: https://api.sftptogo.com
    description: Production
security:
  - apiKey: []
tags:
  - name: Credentials
    description: |
      Credentials are the logins your users and systems use to connect over SFTP, FTPS, the web portal and the S3-compatible endpoint. The API calls this resource `users`.
  - name: SSH keys
    description: Public keys attached to a set of credentials, for key-based SFTP sign-in.
  - name: S3 credentials
    description: S3-compatible access keys attached to a set of credentials.
  - name: Share links
    description: |
      Links that give someone access to a folder through the web portal, without an SFTP client. The API calls this resource `portal-links`.
  - name: Automations
    description: |
      Rules that run when something happens to your files — notify a system, forward a file, encrypt or decrypt it. Automations replace webhooks; an existing webhook can be converted into the equivalent automation, keeping its signing secret so receivers do not notice.
  - name: Automation runs
    description: |
      The execution history of an automation: what triggered it, what each action did, and whether it succeeded. Individual runs can be replayed.
  - name: PGP keys
    description: Keys used by automations that encrypt or decrypt files.
  - name: Audit logs
    description: A record of who did what, across both the dashboard and file activity.
  - name: Audit log streaming
    description: Continuous delivery of audit log events to your own SIEM or log platform.
  - name: Malware scans
    description: Results of malware scanning on uploaded files, and the actions you can take on them.
  - name: Custom domains
    description: Your own hostnames for the SFTP service and the web portal.
  - name: Organization
    description: Your organization's settings, plan, usage metrics and members.
  - name: Team members
    description: |
      People with dashboard access to your organization, and their roles. The API calls this resource `memberships`.
paths:
  /organizations/{organizationId}/users:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: ListCredentials
      summary: List all credentials
      tags:
        - Credentials
      description: |
        Lists your organization's credentials, newest first.

        Results are paged. Pass `limit` and follow the `next` link in the `Link` header to get the next
        page. Without `limit`, a page holds up to 2,000 credentials; this default may be lowered.

        Each set of credentials in the response includes its password in clear text and a connection
        string. Treat the response as a secret: don't log it or pass it to browser or mobile code.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: Returns a page of credentials, newest first.
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
            X-Total-Count-Exact:
              $ref: '#/components/headers/XTotalCountExact'
          content:
            application/json:
              schema:
                type: array
                description: The credentials on this page.
                items:
                  $ref: '#/components/schemas/Credentials'
              examples:
                default:
                  summary: Two sets of credentials
                  value:
                    - Id: 7c2e9a4f1b6d3e8a0c5f2b7d9e1a4c
                      OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
                      UserName: partner-acme
                      Alias: partner-acme
                      State: active
                      Host: example.sftptogo.com
                      HomeDirectory: /home/partner-acme
                      ChrootDirectory: /
                      HomeDirectoryDetails:
