    patch:
      operationId: UpdateCredential
      summary: Update a credential
      tags:
        - Credentials
      description: |
        Changes one or more properties. Send only what you want to change: omitted fields are left
        alone and are not validated.

        Three fields reset rather than clear when you send an empty string: `Alias` returns to the
        login name, `HomeDirectory` to `/home/{UserName}`, and `ChrootDirectory` to `/`.

        Inbound rules take effect only if your plan includes them. On a plan without them, a change to
        `Settings.Network.InboundRules` is skipped without an error, and the rest of the update still
        applies.

        Changes take effect on the next connection; sessions already open are not interrupted. To
        change the password, use the password-rotation endpoint instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialRequest'
            examples:
              permission:
                summary: Reduce access to read-only
                value:
                  Permission: read-only
              virtualFolders:
                summary: Switch to virtual folders
                value:
                  HomeDirectoryDetails:
                    - Entry: /inbound
                      Target: /partners/acme/inbound
                      Permission: write-only
                    - Entry: /outbound
                      Target: /partners/acme/outbound
                      Permission: read-only
              homeDirectory:
                summary: Go back to a home directory
                value:
                  HomeDirectoryDetails: []
                  Permission: read-write
              expiry:
                summary: Remove the expiry date
                value:
                  ExpiresAt: null
              network:
                summary: Allow connections from one more range
                value:
                  Settings:
                    Network:
                      InboundRules:
                        - Id: 9b2e4d6f-1a3c-4e5b-8d7f-0c2a4e6b8d1f
                          Protocol: SFTP
                          State: enabled
                          Action: allow
                          Source: 203.0.113.0/24
                          Description: Warehouse egress range
      responses:
        '200':
          description: The updated credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                default:
                  $ref: '#/components/examples/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The update would give the credential more than 250 inbound rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: forbidden
                    message: You have reached the maximum number of inbound rules per credential (250).
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            The new login name is taken, across the whole service rather than just your organization.
            Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    id: unprocessable_entity
                    message: Unfortunately, the user name is not available. Please choose another one.
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: DeleteCredential
      summary: Delete a credential
      tags:
        - Credentials
      description: |
        Permanently deletes the credential and releases its login name for reuse.

        **Files are not deleted.** They stay in your storage and remain reachable through other
        credentials with the right permissions.

        The organization's default credential cannot be deleted. This cannot be undone: to stop access
        while keeping the credential, deactivate it instead.
      responses:
        '200':
          description: |
            The deleted credential, as it was immediately before deletion, so you can record what was
            removed. Unlike the other credential responses, it does not include the password or the
            connection string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
              examples:
                default:
                  summary: A deleted credential
                  value:
                    Id: 3f9a1c7e5b2d4a6f8e0c1b3d5f7a9c
                    OrganizationId: 6b1f0d2e-4a3c-4f8b-9e0a-2c7d5b8e1f34
